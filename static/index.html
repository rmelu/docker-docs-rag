<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Docs RAG</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#f7f5f6;--card:#fff;--text:#1d1a1c;--muted:#6b6469;--accent:#7b1e3a;--user:#f4e4ea;--border:#e5dde1;--err:#b42318;--side:#efeaec}
  @media (prefers-color-scheme:dark){
    :root{--bg:#141013;--card:#1d171b;--text:#efe9ec;--muted:#a79da3;--accent:#9d2b4e;--user:#3a1a26;--border:#33292f;--err:#f97066;--side:#191316}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
  .layout{display:flex;height:100%}

  /* barra laterale */
  aside{width:270px;flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border)}
  aside .top{padding:12px}
  #newchat{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:.9rem;cursor:pointer;text-align:left}
  #newchat:hover{border-color:var(--accent)}
  aside h2{margin:6px 14px 4px;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  #list{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .item{display:flex;align-items:center;border-radius:8px;margin-bottom:2px}
  .item:hover{background:var(--card)}
  .item.active{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
  .item .open{flex:1;min-width:0;padding:8px 10px;border:0;background:transparent;color:var(--text);font:inherit;font-size:.88rem;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .del{flex:none;width:28px;height:28px;margin-right:4px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:1rem;line-height:1;cursor:pointer;opacity:0}
  .item:hover .del,.item.active .del,.item .del:focus-visible{opacity:1}
  .item .del:hover{color:var(--err)}
  .empty{padding:8px 10px;color:var(--muted);font-size:.85rem}

  /* area principale */
  .app{flex:1;min-width:0;display:flex;flex-direction:column}
  header{padding:14px 16px;border-bottom:3px solid var(--accent);background:var(--card)}
  header .wrap{display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:1.05rem}
  header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
  #menu{display:none;border:1px solid var(--border);background:transparent;color:var(--text);width:36px;height:36px;border-radius:8px;font-size:1.1rem;cursor:pointer}
  main{flex:1;overflow-y:auto;padding:16px}
  .wrap{max-width:820px;margin:0 auto;width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chips[hidden]{display:none}
  .chips button{border:1px solid var(--border);background:var(--card);color:var(--text);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}
  .chips button:hover{border-color:var(--accent)}
  .msg{margin:0 0 12px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);overflow-wrap:anywhere}
  .msg.user{background:var(--user);margin-left:auto;max-width:85%;border-color:transparent}
  .msg.err{border-color:var(--err);color:var(--err)}
  .text{white-space:pre-wrap}
  .dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);animation:blink 1s infinite ease-in-out}
  .dots span:nth-child(2){animation-delay:.15s}
  .dots span:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.dots span{animation:none}}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools button{border:1px solid var(--border);background:transparent;color:var(--muted);padding:4px 10px;border-radius:8px;font:inherit;font-size:.8rem;cursor:pointer}
  .tools button:hover{color:var(--text);border-color:var(--accent)}
  details{margin-top:10px;font-size:.85rem;color:var(--muted)}
  details summary{cursor:pointer}
  .src{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--border)}
  .src b{color:var(--text)}
  .src pre{margin:4px 0 0;white-space:pre-wrap;font:inherit}
  footer{padding:12px 16px;border-top:1px solid var(--border);background:var(--card)}
  form{display:flex;gap:8px;max-width:820px;margin:0 auto}
  input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button.send{padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
  button.send:hover{filter:brightness(1.12)}
  button.send:disabled{opacity:.5;cursor:default}

  /* schermi stretti: la barra diventa un pannello a scomparsa */
  #scrim{display:none}
  @media (max-width:760px){
    aside{position:fixed;z-index:20;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s}
    body.side-open aside{transform:none}
    body.side-open #scrim{display:block;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4)}
    #menu{display:block}
  }
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <div class="top"><button id="newchat" type="button">+ Nuova chat</button></div>
    <h2>Le tue chat</h2>
    <div id="list"></div>
  </aside>
  <div id="scrim"></div>

  <div class="app">
    <header>
      <div class="wrap">
        <button id="menu" type="button" aria-label="Apri elenco chat">&#9776;</button>
        <div>
          <h1>Docker Docs RAG</h1>
          <p>Fai una domanda sulla documentazione Docker (sezioni Compose ed Engine).</p>
        </div>
      </div>
    </header>

    <main id="chat">
      <div class="wrap">
        <div class="chips" id="chips"></div>
        <div id="messages"></div>
      </div>
    </main>

    <footer>
      <form id="form">
        <input id="q" placeholder="Scrivi una domanda..." autocomplete="off" minlength="3" required>
        <button class="send" id="send" type="submit">Invia</button>
      </form>
    </footer>
  </div>
</div>

<script>
  const EXAMPLES = [
    "Come limito la memoria di un container?",
    "Come definisco un volume in Docker Compose?",
    "Come avvio più servizi con Docker Compose?"
  ];
  const KEY = "docker-rag-chats-v1";
  const DEFAULT_TITLE = "Nuova chat";

  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  const messages = document.getElementById("messages");
  const chat = document.getElementById("chat");
  const chips = document.getElementById("chips");
  const list = document.getElementById("list");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let chats = [];
  let activeId = null;
  let pending = false;

  /* ---------- salvataggio ---------- */
  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(data)) chats = data.filter(c => c && c.id && Array.isArray(c.messages));
    } catch (e) { chats = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch (e) { /* spazio pieno o storage bloccato */ }
  }
  function active() { return chats.find(c => c.id === activeId); }

  /* ---------- gestione chat ---------- */
  function createChat() {
    const c = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: DEFAULT_TITLE, messages: [], updated: Date.now()
    };
    chats.unshift(c);
    return c;
  }

  function newChat() {
    const cur = active();
    if (cur && cur.messages.length === 0) { openChat(cur.id); return; }   // niente chat vuote in serie
    const c = createChat();
    save();
    openChat(c.id);
  }

  function openChat(id) {
    activeId = id;
    renderSidebar();
    renderMessages();
    document.body.classList.remove("side-open");
    input.focus();
  }

  function deleteChat(id) {
    if (!confirm("Eliminare questa chat?")) return;
    chats = chats.filter(c => c.id !== id);
    if (!chats.length) createChat();
    save();
    if (id === activeId) {
      const next = [...chats].sort((a, b) => b.updated - a.updated)[0];
      openChat(next.id);
    } else {
      renderSidebar();
    }
  }

  function renderSidebar() {
    list.textContent = "";
    const sorted = [...chats].sort((a, b) => b.updated - a.updated);
    sorted.forEach(c => {
      const row = document.createElement("div");
      row.className = "item" + (c.id === activeId ? " active" : "");
      const open = document.createElement("button");
      open.type = "button";
      open.className = "open";
      open.textContent = c.title;
      open.title = c.title;
      open.addEventListener("click", () => openChat(c.id));
      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.textContent = "\u00d7";
      del.setAttribute("aria-label", "Elimina chat");
      del.addEventListener("click", (ev) => { ev.stopPropagation(); deleteChat(c.id); });
      row.append(open, del);
      list.appendChild(row);
    });
  }

  /* ---------- messaggi ---------- */
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addMsg(kind, text) {
    const box = document.createElement("div");
    box.className = "msg " + kind;
    const t = document.createElement("div");
    t.className = "text";
    t.textContent = text;          // textContent: il testo non viene mai interpretato come HTML
    box.appendChild(t);
    messages.appendChild(box);
    scrollDown();
    return box;
  }

  function loader() {
    const d = document.createElement("span");
    d.className = "dots";
    for (let i = 0; i < 3; i++) d.appendChild(document.createElement("span"));
    return d;
  }

  function typeInto(el, text, onDone) {
    if (reduceMotion) { el.textContent = text; onDone(); return; }
    let i = 0;
    const step = Math.max(2, Math.ceil(text.length / 150));
    const timer = setInterval(() => {
      i = Math.min(text.length, i + step);
      el.textContent = text.slice(0, i);
      scrollDown();
      if (i >= text.length) { clearInterval(timer); onDone(); }
    }, 15);
  }

  function addSources(box, fonti) {
    if (!fonti || !fonti.length) return;
    const d = document.createElement("details");
    const s = document.createElement("summary");
    s.textContent = "Fonti (" + fonti.length + ")";
    d.appendChild(s);
    fonti.forEach((f, i) => {
      const item = document.createElement("div");
      item.className = "src";
      const title = document.createElement("b");
      title.textContent = "[" + (i + 1) + "] " + f.source + "  (somiglianza " + f.similarita + ")";
      const pre = document.createElement("pre");
      pre.textContent = f.testo;
      item.append(title, pre);
      d.appendChild(item);
    });
    box.appendChild(d);
  }

  function download(name, content) {
    const blob = new Blob([content], {type: "text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function addTools(box, domanda, risposta, fonti) {
    const bar = document.createElement("div");
    bar.className = "tools";

    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copia";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(risposta);
        copy.textContent = "Copiato \u2713";
      } catch (e) {
        copy.textContent = "Copia non riuscita";
      }
      setTimeout(() => { copy.textContent = "Copia"; }, 1500);
    });

    const dl = document.createElement("button");
    dl.type = "button";
    dl.textContent = "Scarica .txt";
    dl.addEventListener("click", () => {
      let out = "Domanda:\n" + domanda + "\n\nRisposta:\n" + risposta + "\n";
      if (fonti && fonti.length) {
        out += "\nFonti:\n" + fonti.map((f, i) => "[" + (i + 1) + "] " + f.source).join("\n") + "\n";
      }
      download("risposta-docker-rag.txt", out);
    });

    bar.append(copy, dl);
    box.appendChild(bar);
  }

  // Disegna un messaggio salvato. animate = true solo per la risposta appena arrivata.
  function renderMsg(m, animate) {
    if (m.role === "user") { addMsg("user", m.text); return; }
    const box = addMsg(m.err ? "bot err" : "bot", animate && !m.err ? "" : m.text);
    const t = box.querySelector(".text");
    const finish = () => {
      addSources(box, m.fonti);
      if (m.tools) addTools(box, m.q, m.text, m.fonti);
      scrollDown();
    };
    if (animate && !m.err) typeInto(t, m.text, finish);
    else finish();
  }

  function renderMessages() {
    messages.textContent = "";
    const c = active();
    c.messages.forEach(m => renderMsg(m, false));
    chips.hidden = c.messages.length > 0;
    scrollDown();
  }

  /* ---------- domanda al server ---------- */
  async function ask(domanda) {
    const c = active();
    pending = true;
    send.disabled = true;

    c.messages.push({role: "user", text: domanda});
    if (c.title === DEFAULT_TITLE) c.title = domanda.length > 40 ? domanda.slice(0, 40) + "\u2026" : domanda;
    c.updated = Date.now();
    save();
    renderSidebar();
    chips.hidden = true;
    addMsg("user", domanda);

    const wait = addMsg("bot", "");
    wait.querySelector(".text").appendChild(loader());

    let reply;
    try {
      const r = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({domanda: domanda, k: 4})
      });
      if (r.status === 422) throw new Error("Scrivi una domanda di almeno 3 caratteri.");
      if (r.status === 502) throw new Error("Il servizio LLM non ha risposto. Riprova tra poco.");
      if (!r.ok) throw new Error("Errore del server (" + r.status + ").");
      const data = await r.json();
      reply = {
        role: "bot", q: domanda,
        text: data.risposta || data.nota || "Nessuna risposta.",
        fonti: data.fonti || [], tools: !!data.risposta
      };
    } catch (e) {
      reply = {role: "bot", err: true, text: e.message || "Impossibile contattare il server."};
    }

    c.messages.push(reply);
    c.updated = Date.now();
    save();
    wait.remove();
    // Se nel frattempo hai aperto un'altra chat, la risposta resta salvata in quella giusta.
    if (c.id === activeId) renderMsg(reply, true);
    renderSidebar();
    pending = false;
    send.disabled = false;
    if (c.id === activeId) input.focus();
  }

  /* ---------- eventi ---------- */
  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (pending) return;
    const q = input.value.trim();
    if (q.length < 3) return;
    input.value = "";
    ask(q);
  });

  document.getElementById("newchat").addEventListener("click", newChat);
  document.getElementById("menu").addEventListener("click", () => document.body.classList.add("side-open"));
  document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("side-open"));

  EXAMPLES.forEach((text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.addEventListener("click", () => { if (!pending) ask(text); });
    chips.appendChild(b);
  });

  /* ---------- avvio ---------- */
  load();
  if (!chats.length) createChat();
  const last = [...chats].sort((a, b) => b.updated - a.updated)[0];
  openChat(last.id);
</script>
</body>
</html>
